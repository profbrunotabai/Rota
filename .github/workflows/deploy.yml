# Publica o site no GitHub Pages a cada envio (push) para o GitHub.
# Antes da primeira vez: Settings > Pages > Source: GitHub Actions.
name: Publicar o site

on:
  push:
    branches:
      - main
      - master
      - v5
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # histórico completo, para as datas das páginas
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Guardar dependências em cache
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Instalar dependências
        run: npm ci
      - name: Dar permissão de execução ao Quartz
        run: chmod +x quartz/bootstrap-cli.mjs # o Windows perde essa permissão ao descompactar
      - name: Instalar plugins do Quartz
        run: npx quartz plugin install --from-config
      - name: Ajustar o endereço do site
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          if [ "${repo,,}" = "${owner}.github.io" ]; then
            base="${owner}.github.io"
          else
            base="${owner}.github.io/${repo}"
          fi
          sed -i "s#SEU-USUARIO.github.io/rota#${base}#g" quartz.config.yaml
          grep -n "baseUrl" quartz.config.yaml
      - name: Gerar o site
        run: npx quartz build
      - name: Enviar o site gerado
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
